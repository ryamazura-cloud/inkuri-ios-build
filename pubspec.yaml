name: phrase_flow
description: Offline Japanese to English sentence training.
publish_to: none
version: 0.16.20+49
environment:
  sdk: '>=3.10.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  shared_preferences: ^2.5.6
  cupertino_icons: ^1.0.8
  flutter_tts: ^4.2.5
  audioplayers: ^6.8.1
  share_plus: ^13.3.1
  flutter_local_notifications: 22.3.3
  flutter_timezone: ^5.1.1
  timezone: ^0.11.2
  firebase_core: ^5.1.0
  firebase_analytics: ^13.0.1
  google_mobile_ads: ^9.2.0
  in_app_purchase: ^3.3.1
  in_app_review: ^2.0.12
  firebase_app_check: ^0.5.1
  http: ^1.6.0
  url_launcher: ^6.3.3
dev_dependencies:
  integration_test:
    sdk: flutter
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  crypto: ^3.0.6
flutter:
  uses-material-design: true
  assets:
    - assets/questions.json
    - assets/grammar.json
    - assets/fonts/OFL.txt
    - assets/audio/
    - assets/brand/
    - assets/characters/beauty/
    - assets/characters/health/
    - assets/characters/food/
    - assets/characters/fashion/
    - assets/characters/entertainment/
    - assets/characters/lifestyle/
    - assets/characters/parenting/
    - assets/characters/learning/
    - assets/characters/relationships/
    - assets/characters/pets/
    - assets/characters/games/
    - assets/characters/business/
    - assets/characters/travel/
    - assets/characters/cars/
    - assets/characters/gadgets/
    - assets/characters/sports/
    - assets/characters/money/
    - assets/guide/
  fonts:
    - family: NotoSansJP
      fonts:
        - asset: assets/fonts/NotoSansJP.ttf
