name: Inkuri App Store build

on:
  workflow_dispatch:
    inputs:
      build_number:
        description: Unused App Store Connect build number for version 1.1
        required: true
        type: string
      upload_to_app_store:
        description: Upload the verified signed IPA to App Store Connect
        required: true
        default: false
        type: boolean
      runner_image:
        description: Standard macOS runner image
        required: true
        default: macos-26
        type: choice
        options:
          - macos-26
          - macos-26-intel
          - xcode-27

permissions:
  contents: read

jobs:
  build:
    if: ${{ github.event_name == 'workflow_dispatch' && github.repository == 'ryamazura-cloud/inkuri-ios-build' && github.actor == 'ryamazura-cloud' && github.ref == 'refs/heads/main' }}
    runs-on: ${{ inputs.runner_image || 'macos-26' }}
    timeout-minutes: 45
    env:
      APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Check signing configuration
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$APPLE_TEAM_ID"
          test -n "$BUILD_CERTIFICATE_BASE64"
          test -n "$P12_PASSWORD"
          test -n "$BUILD_PROVISION_PROFILE_BASE64"
      - name: Set up Flutter
        run: |
          set -euo pipefail
          git clone --depth 1 --branch 3.47.9 https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - name: Install iOS Firebase configuration
        env:
          IOS_FIREBASE_CONFIG_BASE64: ${{ secrets.IOS_FIREBASE_CONFIG_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$IOS_FIREBASE_CONFIG_BASE64"
          printf '%s' "$IOS_FIREBASE_CONFIG_BASE64" | base64 --decode > ios/Runner/GoogleService-Info.plist
          python3 - <<'PY'
          import pathlib, plistlib
          config = plistlib.loads(pathlib.Path('ios/Runner/GoogleService-Info.plist').read_bytes())
          assert config['BUNDLE_ID'] == 'biz.wisemap.encre', 'Firebase bundle mismatch'
          assert config['PROJECT_ID'] == 'encre-ab3d8', 'Firebase project mismatch'
          PY
      - name: Install signing identity
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          printf '%s' "$BUILD_CERTIFICATE_BASE64" | base64 --decode > "$RUNNER_TEMP/distribution.p12"
          printf '%s' "$BUILD_PROVISION_PROFILE_BASE64" | base64 --decode > "$RUNNER_TEMP/app.mobileprovision"
          keychain_password=$(openssl rand -hex 32)
          echo "::add-mask::$keychain_password"
          security create-keychain -p "$keychain_password" "$RUNNER_TEMP/inkuri.keychain-db"
          security set-keychain-settings -lut 21600 "$RUNNER_TEMP/inkuri.keychain-db"
          security unlock-keychain -p "$keychain_password" "$RUNNER_TEMP/inkuri.keychain-db"
          security import "$RUNNER_TEMP/distribution.p12" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$RUNNER_TEMP/inkuri.keychain-db" >/dev/null
          security set-key-partition-list -S apple-tool:,apple: -k "$keychain_password" "$RUNNER_TEMP/inkuri.keychain-db" >/dev/null
          security list-keychains -d user -s "$RUNNER_TEMP/inkuri.keychain-db"
          security cms -D -i "$RUNNER_TEMP/app.mobileprovision" > "$RUNNER_TEMP/profile.plist"
          python3 - <<'PY'
          import os, pathlib, plistlib, shutil
          profile = plistlib.loads(pathlib.Path(os.environ['RUNNER_TEMP'], 'profile.plist').read_bytes())
          team = os.environ['APPLE_TEAM_ID']
          assert team in profile['TeamIdentifier'], 'Provisioning team mismatch'
          assert profile['Entitlements']['application-identifier'] == team + '.biz.wisemap.encre', 'Bundle ID mismatch'
          assert not profile['Entitlements'].get('get-task-allow', False), 'Development profile is not valid for distribution'
          assert 'ProvisionedDevices' not in profile and not profile.get('ProvisionsAllDevices', False), 'App Store profile required'
          destination = pathlib.Path.home() / 'Library/MobileDevice/Provisioning Profiles'
          destination.mkdir(parents=True, exist_ok=True)
          shutil.copyfile(pathlib.Path(os.environ['RUNNER_TEMP'], 'app.mobileprovision'), destination / (profile['UUID'] + '.mobileprovision'))
          export = {'method': 'app-store-connect', 'teamID': team, 'signingStyle': 'manual', 'signingCertificate': 'Apple Distribution', 'provisioningProfiles': {'biz.wisemap.encre': profile['Name']}}
          pathlib.Path(os.environ['RUNNER_TEMP'], 'ExportOptions.plist').write_bytes(plistlib.dumps(export))
          with open(os.environ['GITHUB_ENV'], 'a') as env:
              env.write('PROFILE_UUID=' + profile['UUID'] + '\n')
          PY
      - name: Resolve dependencies and test
        run: |
          set -euo pipefail
          flutter pub get --enforce-lockfile
          flutter test
      - name: Configure distribution signing
        run: |
          set -euo pipefail
          gem install xcodeproj --no-document
          ruby - <<'RUBY'
          require 'xcodeproj'
          project = Xcodeproj::Project.open('ios/Runner.xcodeproj')
          runner = project.targets.find { |target| target.name == 'Runner' }
          group = project.main_group.find_subpath('Runner', false)
          config = group.files.find { |file| file.path == 'GoogleService-Info.plist' } || group.new_file('GoogleService-Info.plist')
          runner.resources_build_phase.add_file_reference(config) unless runner.resources_build_phase.files_references.include?(config)
          project.targets.select { |target| target.name == 'Runner' }.each do |target|
            target.build_configurations.each do |configuration|
              configuration.build_settings['DEVELOPMENT_TEAM'] = ENV.fetch('APPLE_TEAM_ID')
              configuration.build_settings['CODE_SIGN_STYLE'] = 'Manual'
              configuration.build_settings['CODE_SIGN_IDENTITY'] = 'Apple Distribution'
              configuration.build_settings['PROVISIONING_PROFILE_SPECIFIER'] = ENV.fetch('PROFILE_UUID')
            end
          end
          project.save
          RUBY
      - name: Build IPA
        env:
          BUILD_NUMBER: ${{ inputs.build_number }}
        run: |
          set -euo pipefail
          [[ "$BUILD_NUMBER" =~ ^[1-9][0-9]*$ ]]
          flutter build ipa --release --no-pub --build-name 1.1.0 --build-number "$BUILD_NUMBER" --export-options-plist="$RUNNER_TEMP/ExportOptions.plist" \
            --dart-define=INKURI_IOS_MONETIZATION_PRODUCTION=true \
            --dart-define=INKURI_ADMOB_HOME_BANNER=ca-app-pub-2142000020431433/1508627906 \
            --dart-define=INKURI_ADMOB_HISTORY_BANNER=ca-app-pub-2142000020431433/5429505703 \
            --dart-define=INKURI_ADMOB_RESULT_BANNER=ca-app-pub-2142000020431433/5314130644 \
            --dart-define=INKURI_ADMOB_REWARDED=ca-app-pub-2142000020431433/2388409396
          test -n "$(find build/ios/ipa -name '*.ipa' -print -quit)"
          shasum -a 256 build/ios/ipa/*.ipa
      - name: Verify exported IPA
        env:
          BUILD_NUMBER: ${{ inputs.build_number }}
        run: |
          set -euo pipefail
          ipa=$(find build/ios/ipa -name '*.ipa' -print -quit)
          ditto -x -k "$ipa" "$RUNNER_TEMP/verify-ipa"
          app=$(find "$RUNNER_TEMP/verify-ipa/Payload" -maxdepth 1 -name '*.app' -print -quit)
          codesign --verify --deep --strict "$app"
          codesign -d --entitlements :- "$app" > "$RUNNER_TEMP/ipa-entitlements.plist" 2>/dev/null
          python3 - <<'PY'
          import hashlib, json, os, pathlib, plistlib
          app = next((pathlib.Path(os.environ['RUNNER_TEMP'])/'verify-ipa'/'Payload').glob('*.app'))
          info = plistlib.loads((app/'Info.plist').read_bytes())
          firebase = plistlib.loads((app/'GoogleService-Info.plist').read_bytes())
          entitlements = plistlib.loads((pathlib.Path(os.environ['RUNNER_TEMP'])/'ipa-entitlements.plist').read_bytes())
          assert info['CFBundleIdentifier'] == 'biz.wisemap.encre', 'Bundle mismatch'
          assert info['CFBundleShortVersionString'] == '1.1.0', 'Version mismatch'
          assert info['CFBundleVersion'] == os.environ['BUILD_NUMBER'], 'Build mismatch'
          assert info['GADApplicationIdentifier'] == 'ca-app-pub-2142000020431433~3837222433', 'AdMob app mismatch'
          assert info.get('ITSAppUsesNonExemptEncryption') is False, 'Encryption declaration mismatch'
          assert firebase['BUNDLE_ID'] == 'biz.wisemap.encre' and firebase['PROJECT_ID'] == 'encre-ab3d8', 'Firebase app mismatch'
          assert entitlements['application-identifier'] == os.environ['APPLE_TEAM_ID']+'.biz.wisemap.encre', 'Signing app mismatch'
          assert not entitlements.get('get-task-allow', False), 'Development entitlement present'
          assets = app/'Frameworks'/'App.framework'/'flutter_assets'/'assets'
          files = [file for file in pathlib.Path('assets').rglob('*') if file.is_file()]
          for file in files:
              exported = assets/file.relative_to('assets')
              assert exported.is_file() and hashlib.sha256(exported.read_bytes()).digest() == hashlib.sha256(file.read_bytes()).digest(), 'Bundled asset mismatch: '+str(file)
          audio = len(list((assets/'audio').rglob('*.m4a')))
          characters = len(list((assets/'characters').rglob('*.jpg')))
          assert audio == 3865 and characters == 85, 'Bundled asset count mismatch'
          ipa = next(pathlib.Path('build/ios/ipa').glob('*.ipa'))
          report = dict(bundle=info['CFBundleIdentifier'], version=info['CFBundleShortVersionString'], build=info['CFBundleVersion'], sha256=hashlib.sha256(ipa.read_bytes()).hexdigest(), bytes=ipa.stat().st_size, signature_verified=True, distribution_entitlements_verified=True, firebase_app_matches=True, admob_app_matches=True, non_exempt_encryption=False, assets_checked=len(files), audio_clips=audio, character_images=characters)
          pathlib.Path('build/ios/ipa/IPA-VERIFICATION.json').write_text(json.dumps(report, indent=2))
          print(json.dumps(report))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: inkuri-app-store-1.1-${{ inputs.build_number }}
          path: |
            build/ios/ipa/*.ipa
            build/ios/ipa/IPA-VERIFICATION.json
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
      - name: Upload verified IPA to App Store Connect
        if: ${{ inputs.upload_to_app_store }}
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY_BASE64: ${{ secrets.ASC_PRIVATE_KEY_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$ASC_KEY_ID"
          test -n "$ASC_ISSUER_ID"
          test -n "$ASC_PRIVATE_KEY_BASE64"
          umask 077
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          printf '%s' "$ASC_PRIVATE_KEY_BASE64" | base64 --decode > "$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8"
          ipa=$(find build/ios/ipa -name '*.ipa' -print -quit)
          xcrun altool --validate-app --type ios --file "$ipa" --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"
          xcrun altool --upload-app --type ios --file "$ipa" --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"
          echo "Uploaded the verified IPA. Apple processing remains to be checked." >> "$GITHUB_STEP_SUMMARY"
      - name: Remove temporary upload authentication
        if: always()
        run: |
          rm -f "$HOME"/.appstoreconnect/private_keys/AuthKey_*.p8
      - name: Remove temporary signing identity
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/inkuri.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/distribution.p12" "$RUNNER_TEMP/app.mobileprovision" "$RUNNER_TEMP/profile.plist"
